<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>通用航空 六聯儀表 (Six-Pack Flight Deck - IoT Edition)</title>
  <!-- 引入 MQTT.js CDN 支援 WebSocket over MQTT -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --panel-bg: #1e2023;
      --panel-rim: #141518;
      --bezel-dark: #121315;
      --gauge-face: #141517;
      --sky-blue: #4aa3df;
      --ground-brown: #8a572a;
      --dial-white: #f0f2f5;
      --needle-white: #ffffff;
      --accent-yellow: #f5b041;
      --accent-orange: #e67e22;
      --arc-green: #27ae60;
      --arc-yellow: #f39c12;
      --arc-red: #e74c3c;
      --light-intensity: 0.85;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c0e;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
    }

    .header-title {
      text-align: center;
      margin-bottom: 16px;
    }

    .header-title h1 {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #cfd4dc;
      text-transform: uppercase;
      font-weight: 700;
    }

    .header-title p {
      font-size: 0.85rem;
      color: #7b828e;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* 方案 C：遙測通訊控制條 */
    .telemetry-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 18px;
      margin-bottom: 14px;
      background: #14161a;
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid #282c35;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.05), 0 6px 14px rgba(0,0,0,0.5);
      max-width: 760px;
      width: 100%;
    }

    .telemetry-settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .telemetry-title {
      font-size: 0.82rem;
      color: #8b94a0;
      font-weight: 600;
    }

    .conn-select, .conn-input {
      background: #1e2229;
      color: #cfd6e2;
      border: 1px solid #363c48;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
      font-family: monospace;
      transition: border-color 0.2s;
    }

    .conn-select:focus, .conn-input:focus {
      border-color: #3b8cf6;
    }

    .conn-input { width: 170px; }
    .topic-input { width: 150px; }
    .topic-label { font-size: 0.78rem; color: #7b8390; }

    .btn-conn {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #3b82f6;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-conn:hover { background: #1d4ed8; }
    .btn-conn.connected { background: #b91c1c; border-color: #ef4444; }

    .telemetry-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #9aa3b2;
    }

    .status-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      transition: all 0.3s ease;
    }

    .status-indicator.connecting {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulse 1s infinite;
    }

    .status-indicator.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .rx-badge {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0369a1;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: monospace;
      font-weight: bold;
    }

    .rx-pulse {
      animation: rx-glow 0.15s ease-out;
    }

    @keyframes rx-glow {
      0% { box-shadow: 0 0 12px #38bdf8; color: #fff; }
      100% { box-shadow: none; color: #38bdf8; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    /* 航空儀表夜航照明控制條 */
    .lighting-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px 20px;
      margin-bottom: 20px;
      background: #141619;
      padding: 9px 20px;
      border-radius: 40px;
      border: 1px solid #282c34;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.06), 0 6px 16px rgba(0,0,0,0.6);
    }

    .lighting-modes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lighting-title {
      font-size: 0.82rem;
      color: #8b94a0;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-right: 4px;
    }

    .mode-btn {
      background: #1f2228;
      color: #9aa3b2;
      border: 1px solid #333842;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.22s ease;
    }

    .mode-btn:hover { color: #ffffff; background: #2b303a; border-color: #444c59; }
    .mode-btn.active[data-mode="day"] { background: #333a46; border-color: #5c687c; color: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.18); }
    .mode-btn.active[data-mode="red"] { background: #480f13; border-color: #ff3b30; color: #ff8a80; box-shadow: 0 0 14px rgba(255, 59, 48, 0.45); }
    .mode-btn.active[data-mode="amber"] { background: #462808; border-color: #ff9500; color: #ffd180; box-shadow: 0 0 14px rgba(255, 149, 0, 0.45); }

    .lighting-dimmer {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #8b94a0;
      border-left: 1px solid #282c34;
      padding-left: 16px;
    }

    .lighting-dimmer span { color: #4aa3df; font-family: monospace; font-weight: bold; }
    .lighting-dimmer input[type="range"] { width: 90px; height: 4px; }

    /* 姿態儀俯仰文字銳利清晰化處理 */
    #ai-pitch-text text {
      paint-order: stroke fill;
      stroke: rgba(0, 0, 0, 0.6);
      stroke-width: 0.8px;
      letter-spacing: 0.5px;
    }

    /* 2x3 儀表主控制台 */
    .cockpit-panel {
      background: radial-gradient(circle at 50% 35%, #2a2d33 0%, #151619 100%);
      padding: 28px 30px;
      border-radius: 20px;
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.1),
        inset 0 -5px 12px rgba(0, 0, 0, 0.9),
        0 25px 50px rgba(0, 0, 0, 0.95);
      border: 3px solid #2f3238;
      display: grid;
      grid-template-columns: repeat(3, 215px);
      grid-template-rows: repeat(2, 215px);
      gap: 26px;
      position: relative;
      transition: all 0.3s ease;
    }

    /* 儀表金屬外框 */
    .instrument-unit {
      position: relative;
      background: radial-gradient(circle at center, #18191c 65%, #0d0e10 100%);
      border-radius: 50%;
      border: 5px solid #2a2d32;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.95), 0 6px 12px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .instrument-unit::before, .instrument-unit::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      background: radial-gradient(circle, #777c85 30%, #1a1c1f 100%);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.9);
      z-index: 10;
    }
    .instrument-unit::before { top: -7px; left: -7px; }
    .instrument-unit::after { bottom: -7px; right: -7px; }

    .instrument-svg { width: 100%; height: 100%; display: block; }
    .smooth-transition { transition: transform 0.12s cubic-bezier(0.1, 0.8, 0.25, 1); }

    /* 照明模式夜間渲染 */
    .cockpit-panel.lighting-red {
      box-shadow: inset 0 0 70px rgba(255, 20, 20, calc(0.18 * var(--light-intensity))), 0 25px 50px rgba(0, 0, 0, 0.95);
      border-color: #3d1c1f;
    }
    .cockpit-panel.lighting-red .instrument-unit {
      border-color: #2e1719;
      box-shadow: inset 0 0 calc(28px * var(--light-intensity)) rgba(255, 30, 30, calc(0.35 * var(--light-intensity))), 0 0 calc(15px * var(--light-intensity)) rgba(255, 20, 20, calc(0.2 * var(--light-intensity)));
    }
    .cockpit-panel.lighting-red svg text { fill: #ff4757 !important; filter: drop-shadow(0 0 calc(2px * var(--light-intensity)) rgba(255, 71, 87, 0.75)); }
    .cockpit-panel.lighting-red svg line:not([stroke="var(--arc-red)"]) { stroke: #ff4757 !important; filter: drop-shadow(0 0 calc(1.5px * var(--light-intensity)) rgba(255, 71, 87, 0.5)); }
    .cockpit-panel.lighting-red svg polygon:not([fill="var(--gauge-face)"]):not([fill="#16181b"]):not([points="100,21 95,14 105,14"]) { fill: #ff5566 !important; }
    .cockpit-panel.lighting-red #hi-airplane-silhouette path { stroke: #ff4757 !important; fill: #20080a !important; }
    .cockpit-panel.lighting-red #alt-kollsman { fill: #ff3b30 !important; }
    .cockpit-panel.lighting-red #needle-asi polygon, .cockpit-panel.lighting-red #needle-alt-100 polygon, .cockpit-panel.lighting-red #needle-alt-1k polygon, .cockpit-panel.lighting-red #needle-alt-10k polygon, .cockpit-panel.lighting-red #needle-vsi polygon, .cockpit-panel.lighting-red #tc-airplane circle, .cockpit-panel.lighting-red #tc-airplane rect, .cockpit-panel.lighting-red #tc-airplane polygon { fill: #ff6b81 !important; stroke: #ff6b81 !important; filter: drop-shadow(0 0 calc(3px * var(--light-intensity)) rgba(255, 107, 129, 0.85)); }
    .cockpit-panel.lighting-red #unit-ai rect[fill="var(--sky-blue)"] { fill: #141c26 !important; }
    .cockpit-panel.lighting-red #unit-ai rect[fill="var(--ground-brown)"] { fill: #1c100a !important; }
    .cockpit-panel.lighting-red #ai-aircraft-ref circle, .cockpit-panel.lighting-red #ai-aircraft-ref rect { fill: #ff6b81 !important; }

    .cockpit-panel.lighting-amber {
      box-shadow: inset 0 0 70px rgba(255, 150, 20, calc(0.18 * var(--light-intensity))), 0 25px 50px rgba(0, 0, 0, 0.95);
      border-color: #3d2b18;
    }
    .cockpit-panel.lighting-amber .instrument-unit {
      border-color: #2e2114;
      box-shadow: inset 0 0 calc(28px * var(--light-intensity)) rgba(255, 160, 30, calc(0.35 * var(--light-intensity))), 0 0 calc(15px * var(--light-intensity)) rgba(255, 140, 20, calc(0.2 * var(--light-intensity)));
    }
    .cockpit-panel.lighting-amber svg text { fill: #ffaa33 !important; filter: drop-shadow(0 0 calc(2px * var(--light-intensity)) rgba(255, 170, 51, 0.75)); }
    .cockpit-panel.lighting-amber svg line:not([stroke="var(--arc-red)"]) { stroke: #ff9922 !important; filter: drop-shadow(0 0 calc(1.5px * var(--light-intensity)) rgba(255, 153, 34, 0.5)); }
    .cockpit-panel.lighting-amber svg polygon:not([fill="var(--gauge-face)"]):not([fill="#16181b"]):not([points="100,21 95,14 105,14"]) { fill: #ffaa33 !important; }
    .cockpit-panel.lighting-amber #hi-airplane-silhouette path { stroke: #ffaa33 !important; fill: #221708 !important; }
    .cockpit-panel.lighting-amber #alt-kollsman { fill: #ffbb44 !important; }
    .cockpit-panel.lighting-amber #needle-asi polygon, .cockpit-panel.lighting-amber #needle-alt-100 polygon, .cockpit-panel.lighting-amber #needle-alt-1k polygon, .cockpit-panel.lighting-amber #needle-alt-10k polygon, .cockpit-panel.lighting-amber #needle-vsi polygon, .cockpit-panel.lighting-amber #tc-airplane circle, .cockpit-panel.lighting-amber #tc-airplane rect, .cockpit-panel.lighting-amber #tc-airplane polygon { fill: #ffcc66 !important; stroke: #ffcc66 !important; filter: drop-shadow(0 0 calc(3px * var(--light-intensity)) rgba(255, 204, 102, 0.85)); }
    .cockpit-panel.lighting-amber #unit-ai rect[fill="var(--sky-blue)"] { fill: #141c26 !important; }
    .cockpit-panel.lighting-amber #unit-ai rect[fill="var(--ground-brown)"] { fill: #1a130a !important; }
    .cockpit-panel.lighting-amber #ai-aircraft-ref circle, .cockpit-panel.lighting-amber #ai-aircraft-ref rect { fill: #ffb84d !important; }

    /* 控制面板 */
    .controls-wrapper {
      margin-top: 24px;
      background: #17181b;
      padding: 20px 26px;
      border-radius: 14px;
      border: 1px solid #2c3038;
      box-shadow: 0 12px 25px rgba(0,0,0,0.6);
      max-width: 760px;
      width: 100%;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px 22px;
    }

    .control-item { display: flex; flex-direction: column; gap: 5px; }
    .control-item label { display: flex; justify-content: space-between; font-size: 0.82rem; color: #9aa1ad; font-weight: 500; }
    .control-item span.val { color: #4aa3df; font-weight: 600; font-family: monospace; font-size: 0.9rem; }
    input[type="range"] { width: 100%; height: 5px; background: #2b2e35; border-radius: 3px; outline: none; accent-color: #3897f0; cursor: pointer; }

    .control-actions {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #262930;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      background: #252a33;
      color: #cfd6e0;
      border: 1px solid #3d4554;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: #343c49; color: #fff; }
    .btn.active { background: #1d6fd8; border-color: #3b8cf6; color: #fff; box-shadow: 0 0 12px rgba(37, 111, 216, 0.5); }

    .status-badge {
      font-size: 0.78rem;
      color: #6d7685;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27ae60;
      box-shadow: 0 0 6px #27ae60;
    }

    @media (max-width: 768px) {
      .cockpit-panel {
        grid-template-columns: repeat(2, 170px);
        grid-template-rows: repeat(3, 170px);
        gap: 18px;
        padding: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="header-title">
    <h1>Cessna Six-Pack 飛行六聯儀表</h1>
    <p>高擬真 SVG + CSS + JS 即時數據驅動模擬儀表板</p>
  </div>

  <!-- 方案 C：遙測與通訊協議控制列 -->
  <div class="telemetry-toolbar">
    <div class="telemetry-settings">
      <span class="telemetry-title">📡 遙測連線：</span>
      <select id="conn-protocol" class="conn-select">
        <option value="ws">WebSocket</option>
        <option value="mqtt">MQTT (over WS)</option>
      </select>
      <input type="text" id="conn-url" class="conn-input" placeholder="ws://localhost:8080" value="ws://localhost:8080">
      <div id="mqtt-topic-group" style="display: none; align-items: center; gap: 6px;">
        <span class="topic-label">主題:</span>
        <input type="text" id="conn-topic" class="conn-input topic-input" placeholder="flight/cockpit/telemetry" value="flight/cockpit/telemetry">
      </div>
      <button class="btn-conn" id="btn-connect">連線 (Connect)</button>
    </div>

    <div class="telemetry-status">
      <div class="status-indicator" id="conn-indicator"></div>
      <span id="conn-status-text">未連線 (Offline)</span>
      <span class="rx-badge" id="rx-badge" style="display: none;">RX: <span id="rx-rate">0</span> Hz</span>
    </div>
  </div>

  <!-- 航空儀表夜航照明控制條 -->
  <div class="lighting-toolbar">
    <div class="lighting-modes">
      <span class="lighting-title">💡 儀表夜航照明：</span>
      <button class="mode-btn active" data-mode="day">☀️ 晝間自然光 (Day)</button>
      <button class="mode-btn" data-mode="red">🔴 夜間紅光 (Night Red)</button>
      <button class="mode-btn" data-mode="amber">🟠 暖橘夜航 (Amber Glow)</button>
    </div>
    <div class="lighting-dimmer" id="dimmer-group" style="display: none;">
      <label>照明微調 (Dimmer): <span id="disp-dimmer">85%</span></label>
      <input type="range" id="ctrl-dimmer" min="20" max="100" value="85">
    </div>
  </div>

  <!-- 2x3 六聯儀表板 -->
  <div class="cockpit-panel">
    
    <!-- 1. 左上：空速表 (ASI) -->
    <div class="instrument-unit" id="unit-asi">
      <svg class="instrument-svg" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="95" fill="var(--gauge-face)"/>
        
        <path d="M 46 150 A 73 73 0 0 1 29 118" fill="none" stroke="var(--dial-white)" stroke-width="4.5" />
        <path d="M 29 118 A 73 73 0 0 1 54 44" fill="none" stroke="var(--arc-green)" stroke-width="5" />
        <path d="M 54 44 A 73 73 0 0 1 100 27" fill="none" stroke="var(--arc-yellow)" stroke-width="5" />
        <line x1="100" y1="27" x2="100" y2="15" stroke="var(--arc-red)" stroke-width="3" />

        <g fill="var(--dial-white)" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">
          <text x="100" y="52">260</text>
          <text x="135" y="60">40</text>
          <text x="156" y="86">60</text>
          <text x="155" y="128">80</text>
          <text x="135" y="156">100</text>
          <text x="100" y="168">120</text>
          <text x="65" y="156">140</text>
          <text x="45" y="128">160</text>
          <text x="42" y="86">180</text>
          <text x="62" y="60">220</text>
        </g>
        
        <text x="100" y="87" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">KNOTS</text>
        <text x="100" y="99" fill="#888" font-size="7.5" text-anchor="middle">AIRSPEED</text>

        <g id="needle-asi" class="smooth-transition" transform="rotate(0 100 100)">
          <polygon points="98.5,108 101.5,108 100.8,24 99.2,24" fill="var(--needle-white)" />
          <circle cx="100" cy="100" r="7" fill="#1b1c1e" stroke="#fff" stroke-width="2"/>
        </g>
      </svg>
    </div>

    <!-- 2. 中上：姿態儀 (AI) [俯仰刻度文字完全清晰化] -->
    <div class="instrument-unit" id="unit-ai">
      <svg class="instrument-svg" viewBox="0 0 200 200">
        <defs>
          <clipPath id="ai-clip">
            <circle cx="100" cy="100" r="78" />
          </clipPath>
        </defs>

        <circle cx="100" cy="100" r="95" fill="var(--gauge-face)"/>

        <g clip-path="url(#ai-clip)">
          <g id="ai-horizon-group" class="smooth-transition" transform="translate(0, 0) rotate(0 100 100)">
            <rect x="-100" y="-160" width="400" height="260" fill="var(--sky-blue)" />
            <rect x="-100" y="100" width="400" height="260" fill="var(--ground-brown)" />
            <line x1="-100" y1="100" x2="300" y2="100" stroke="#ffffff" stroke-width="2.5" />
            
            <!-- 俯仰刻度梯：線條與文字解耦，杜絕模糊描邊 -->
            <g stroke="#ffffff" stroke-linecap="round">
              <line x1="92" y1="85" x2="108" y2="85" stroke-width="1.4" />
              <line x1="82" y1="70" x2="118" y2="70" stroke-width="1.8" />
              <line x1="92" y1="55" x2="108" y2="55" stroke-width="1.4" />
              <line x1="82" y1="40" x2="118" y2="40" stroke-width="1.8" />

              <line x1="92" y1="115" x2="108" y2="115" stroke-width="1.4" />
              <line x1="82" y1="130" x2="118" y2="130" stroke-width="1.8" />
              <line x1="92" y1="145" x2="108" y2="145" stroke-width="1.4" />
              <line x1="82" y1="160" x2="118" y2="160" stroke-width="1.8" />
            </g>

            <!-- 俯仰角數值標籤 (字形銳利、微陰影邊框、居中對齊) -->
            <g id="ai-pitch-text" fill="#ffffff" stroke="none" font-size="9" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" dominant-baseline="central">
              <text x="73" y="70">10</text>
              <text x="127" y="70">10</text>
              <text x="73" y="40">20</text>
              <text x="127" y="40">20</text>

              <text x="73" y="130">10</text>
              <text x="127" y="130">10</text>
              <text x="73" y="160">20</text>
              <text x="127" y="160">20</text>

        heading: 0,
        vsi: 0,
        turnRate: 0,
        slipBall: 0,
        baroSetting: 29.92,
        lightingMode: 'day',
        lightingBrightness: 0.85
      },

      setValues: function(data) {
        Object.assign(this.state, data);
        this.render();
      },

      calcVsiAngle: function(fpm) {
        const sign = Math.sign(fpm);
        const absFpm = Math.abs(fpm);
        let angle = 0;
        if (absFpm <= 500) {
          angle = (absFpm / 500) * 32;
        } else if (absFpm <= 1000) {
          angle = 32 + ((absFpm - 500) / 500) * 33;
        } else if (absFpm <= 2000) {
          angle = 65 + ((absFpm - 1000) / 1000) * 45;
        } else if (absFpm <= 4000) {
          angle = 110 + ((absFpm - 2000) / 2000) * 35;
        } else {
          angle = 145 + (Math.min(absFpm, 6000) - 4000) / 2000 * 25;
        }
        return sign * -angle;
      },

      render: function() {
        // 1. 空速表 (ASI)
        const asiAngle = Math.min(Math.max((this.state.airspeed / 260) * 330, 0), 340);
        const needleASI = document.getElementById('needle-asi');
        if (needleASI) needleASI.setAttribute('transform', `rotate(${asiAngle} 100 100)`);

        // 2. 姿態儀 (AI)
        const pitchOffset = this.state.pitch * 3;
        const rollAngle = -this.state.roll;
        const horizonGroup = document.getElementById('ai-horizon-group');
        if (horizonGroup) horizonGroup.setAttribute('transform', `rotate(${rollAngle} 100 100) translate(0, ${pitchOffset})`);

        // 3. 高度表 (Altimeter)
        const alt100Angle = (this.state.altitude % 1000) * 0.36;
        const alt1kAngle = (this.state.altitude % 10000) * 0.036;
        const alt10kAngle = (this.state.altitude % 100000) * 0.0036;

        const nAlt100 = document.getElementById('needle-alt-100');
        const nAlt1k = document.getElementById('needle-alt-1k');
        const nAlt10k = document.getElementById('needle-alt-10k');
        const altFlag = document.getElementById('alt-barber-pole');

        if (nAlt100) nAlt100.setAttribute('transform', `rotate(${alt100Angle} 100 100)`);
        if (nAlt1k) nAlt1k.setAttribute('transform', `rotate(${alt1kAngle} 100 100)`);
        if (nAlt10k) nAlt10k.setAttribute('transform', `rotate(${alt10kAngle} 100 100)`);
        if (altFlag) altFlag.style.opacity = this.state.altitude < 10000 ? '1' : '0';

        // 4. 轉彎協調表 (TC)
        const tcAirplaneAngle = Math.min(Math.max(this.state.turnRate * 6.66, -30), 30);
        const tcAirplane = document.getElementById('tc-airplane');
        if (tcAirplane) tcAirplane.setAttribute('transform', `rotate(${tcAirplaneAngle} 100 100)`);
        
        const ballOffset = Math.min(Math.max(this.state.slipBall * 24, -26), 26);
        const tcBall = document.getElementById('tc-ball');
        if (tcBall) tcBall.setAttribute('cx', ballOffset);

        // 5. 航向指示表 (HI)
        const hiAngle = -this.state.heading;
        const hiRose = document.getElementById('hi-compass-rose');
        if (hiRose) hiRose.setAttribute('transform', `rotate(${hiAngle} 100 100)`);

        // 6. 垂直升降速度表 (VSI)
        const vsiAngle = this.calcVsiAngle(this.state.vsi);
        const needleVSI = document.getElementById('needle-vsi');
        if (needleVSI) needleVSI.setAttribute('transform', `rotate(${vsiAngle} 100 100)`);
      }
    };

    window.FlightCockpit = FlightCockpit;

    // --- DOM 控制項與事件綁定 ---
    const ctrl = {
      asi: document.getElementById('ctrl-asi'),
      alt: document.getElementById('ctrl-alt'),
      pitch: document.getElementById('ctrl-pitch'),
      roll: document.getElementById('ctrl-roll'),
      hdg: document.getElementById('ctrl-hdg'),
      vsi: document.getElementById('ctrl-vsi'),
      turn: document.getElementById('ctrl-turn'),
      slip: document.getElementById('ctrl-slip')
    };

    const disp = {
      asi: document.getElementById('disp-asi'),
      alt: document.getElementById('disp-alt'),
      pitch: document.getElementById('disp-pitch'),
      roll: document.getElementById('disp-roll'),
      hdg: document.getElementById('disp-hdg'),
      vsi: document.getElementById('disp-vsi'),
      turn: document.getElementById('disp-turn'),
      slip: document.getElementById('disp-slip')
    };

    function syncFromSliders() {
      const data = {
        airspeed: parseFloat(ctrl.asi.value),
        altitude: parseFloat(ctrl.alt.value),
        pitch: parseFloat(ctrl.pitch.value),
        roll: parseFloat(ctrl.roll.value),
        heading: parseFloat(ctrl.hdg.value),
        vsi: parseFloat(ctrl.vsi.value),
        turnRate: parseFloat(ctrl.turn.value),
        slipBall: parseFloat(ctrl.slip.value)
      };

      disp.asi.textContent = data.airspeed;
      disp.alt.textContent = data.altitude;
      disp.pitch.textContent = data.pitch;
      disp.roll.textContent = data.roll;
      disp.hdg.textContent = data.heading;
      disp.vsi.textContent = data.vsi;
      disp.turn.textContent = data.turnRate;
      disp.slip.textContent = data.slipBall;

      FlightCockpit.setValues(data);
    }

    Object.values(ctrl).forEach(slider => {
      slider.addEventListener('input', syncFromSliders);
    });

    function syncSlidersFromState() {
      const s = FlightCockpit.state;
      if (ctrl.asi && document.activeElement !== ctrl.asi) { ctrl.asi.value = s.airspeed; disp.asi.textContent = s.airspeed; }
      if (ctrl.alt && document.activeElement !== ctrl.alt) { ctrl.alt.value = s.altitude; disp.alt.textContent = s.altitude; }
      if (ctrl.pitch && document.activeElement !== ctrl.pitch) { ctrl.pitch.value = s.pitch; disp.pitch.textContent = s.pitch; }
      if (ctrl.roll && document.activeElement !== ctrl.roll) { ctrl.roll.value = s.roll; disp.roll.textContent = s.roll; }
      if (ctrl.hdg && document.activeElement !== ctrl.hdg) { ctrl.hdg.value = s.heading; disp.hdg.textContent = s.heading; }
      if (ctrl.vsi && document.activeElement !== ctrl.vsi) { ctrl.vsi.value = s.vsi; disp.vsi.textContent = s.vsi; }
      if (ctrl.turn && document.activeElement !== ctrl.turn) { ctrl.turn.value = s.turnRate; disp.turn.textContent = s.turnRate; }
      if (ctrl.slip && document.activeElement !== ctrl.slip) { ctrl.slip.value = s.slipBall; disp.slip.textContent = s.slipBall; }
    }

    // --- 方案 C：遙測通訊客戶端 (Telemetry Client) ---
    const TelemetryClient = {
      ws: null,
      mqttClient: null,
      protocol: 'ws',
      isConnected: false,
      rxPackets: 0,
      hzTimer: null,

      connect: function(protocol, url, topic) {
        this.protocol = protocol;
        this.updateStatus('connecting', '連線中 (Connecting)...');
        
        if (protocol === 'ws') {
          this.connectWS(url);
        } else if (protocol === 'mqtt') {
          this.connectMQTT(url, topic);
        }
      },

      disconnect: function() {
        if (this.ws) {
          this.ws.close();
          this.ws = null;
        }
        if (this.mqttClient) {
          this.mqttClient.end();
          this.mqttClient = null;
        }
        this.isConnected = false;
        clearInterval(this.hzTimer);
        this.updateStatus('offline', '未連線 (Offline)');
        document.getElementById('rx-badge').style.display = 'none';
        const btn = document.getElementById('btn-connect');
        btn.textContent = '連線 (Connect)';
        btn.classList.remove('connected');
      },

      connectWS: function(url) {
        try {
          this.ws = new WebSocket(url);
          this.ws.onopen = () => this.onConnected();
          this.ws.onmessage = (event) => this.handlePacket(event.data);
          this.ws.onerror = (err) => {
            console.error('[WebSocket Error]', err);
            this.updateStatus('connecting', '連線失敗，重試中...');
          };
          this.ws.onclose = () => {
            if (this.isConnected) this.disconnect();
          };
        } catch (e) {
          console.error(e);
          this.updateStatus('offline', '無效 URL');
          this.disconnect();
        }
      },

      connectMQTT: function(brokerUrl, topic) {
        if (typeof mqtt === 'undefined') {
          alert('MQTT.js 尚未加載完成，請確認網路連線。');
          this.disconnect();
          return;
        }
        try {
          this.mqttClient = mqtt.connect(brokerUrl);
          this.mqttClient.on('connect', () => {
            this.mqttClient.subscribe(topic, (err) => {
              if (!err) this.onConnected();
              else this.updateStatus('offline', '訂閱主題失敗');
            });
          });
          this.mqttClient.on('message', (t, message) => this.handlePacket(message.toString()));
          this.mqttClient.on('error', (err) => {
            console.error('[MQTT Error]', err);
            this.updateStatus('connecting', 'MQTT 錯誤');
          });
          this.mqttClient.on('close', () => {
            if (this.isConnected) this.disconnect();
          });
        } catch (e) {
          console.error(e);
          this.updateStatus('offline', '連線失敗');
          this.disconnect();
        }
      },

      onConnected: function() {
        this.isConnected = true;
        this.updateStatus('connected', '已連線 (Online)');
        const btn = document.getElementById('btn-connect');
        btn.textContent = '中斷 (Disconnect)';
        btn.classList.add('connected');
        document.getElementById('rx-badge').style.display = 'inline-block';

        // 若 Demo 正處於運行中，連線成功後自動停止 Demo
        if (isDemo) btnDemo.click();

        this.rxPackets = 0;
        this.hzTimer = setInterval(() => {
          document.getElementById('rx-rate').textContent = this.rxPackets;
          this.rxPackets = 0;
        }, 1000);
      },

      handlePacket: function(raw) {
        try {
          const data = JSON.parse(raw);
          FlightCockpit.setValues(data);
          
          if (data.lightingMode) {
            applyLighting(data.lightingMode, data.lightingBrightness || 0.85);
          }

          this.rxPackets++;
          const badge = document.getElementById('rx-badge');
          badge.classList.remove('rx-pulse');
          void badge.offsetWidth;
          badge.classList.add('rx-pulse');

          syncSlidersFromState();
        } catch (e) {
          console.warn('[JSON Parse Error]', e, raw);
        }
      },

      updateStatus: function(status, text) {
        const ind = document.getElementById('conn-indicator');
        const txt = document.getElementById('conn-status-text');
        ind.className = 'status-indicator ' + status;
        txt.textContent = text;
      }
    };

    window.TelemetryClient = TelemetryClient;

    // 遙測 UI 事件綁定
    const connProtocol = document.getElementById('conn-protocol');
    const connUrl = document.getElementById('conn-url');
    const mqttTopicGroup = document.getElementById('mqtt-topic-group');
    const connTopic = document.getElementById('conn-topic');
    const btnConnect = document.getElementById('btn-connect');

    connProtocol.addEventListener('change', () => {
      const proto = connProtocol.value;
      if (proto === 'ws') {
        connUrl.placeholder = 'ws://localhost:8080';
        connUrl.value = 'ws://localhost:8080';
        mqttTopicGroup.style.display = 'none';
      } else {
        connUrl.placeholder = 'wss://broker.emqx.io:8084/mqtt';
        connUrl.value = 'wss://broker.emqx.io:8084/mqtt';
        mqttTopicGroup.style.display = 'flex';
      }
    });

    btnConnect.addEventListener('click', () => {
      if (TelemetryClient.isConnected) {
        TelemetryClient.disconnect();
      } else {
        TelemetryClient.connect(
          connProtocol.value,
          connUrl.value.trim(),
          connTopic.value.trim()
        );
      }
    });

    // --- 航空夜航照明系統控制器 ---
    const cockpitPanel = document.querySelector('.cockpit-panel');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const dimmerGroup = document.getElementById('dimmer-group');
    const ctrlDimmer = document.getElementById('ctrl-dimmer');
    const dispDimmer = document.getElementById('disp-dimmer');

    function applyLighting(mode, brightness = 0.85) {
      cockpitPanel.classList.remove('lighting-red', 'lighting-amber');
      modeBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));

      if (mode === 'red') {
        cockpitPanel.classList.add('lighting-red');
        dimmerGroup.style.display = 'flex';
      } else if (mode === 'amber') {
        cockpitPanel.classList.add('lighting-amber');
        dimmerGroup.style.display = 'flex';
      } else {
        dimmerGroup.style.display = 'none';
      }

      document.documentElement.style.setProperty('--light-intensity', brightness);
      ctrlDimmer.value = Math.round(brightness * 100);
      dispDimmer.textContent = Math.round(brightness * 100) + '%';
      
      FlightCockpit.state.lightingMode = mode;
      FlightCockpit.state.lightingBrightness = brightness;
    }

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        const currentBrightness = parseFloat(ctrlDimmer.value) / 100;
        applyLighting(mode, currentBrightness);
      });
    });

    ctrlDimmer.addEventListener('input', () => {
      const brightness = parseFloat(ctrlDimmer.value) / 100;
      dispDimmer.textContent = ctrlDimmer.value + '%';
      document.documentElement.style.setProperty('--light-intensity', brightness);
      FlightCockpit.state.lightingBrightness = brightness;
    });

    FlightCockpit.setLighting = function(mode, brightness = 0.85) {
      applyLighting(mode, brightness);
    };

    // 重設按鈕
    document.getElementById('btn-reset').addEventListener('click', () => {
      ctrl.asi.value = 110;
      ctrl.alt.value = 4500;
      ctrl.pitch.value = 0;
      ctrl.roll.value = 0;
      ctrl.hdg.value = 195;
      ctrl.vsi.value = 0;
      ctrl.turn.value = 0;
      ctrl.slip.value = 0;
      syncFromSliders();
    });

    // --- 自動巡航展示 (Demo Mode) ---
    let isDemo = false;
    let demoTimer = null;
    let t = 0;
    const btnDemo = document.getElementById('btn-toggle-demo');
    const demoIcon = document.getElementById('demo-icon');
    const demoText = document.getElementById('demo-text');

    btnDemo.addEventListener('click', () => {
      isDemo = !isDemo;
      btnDemo.classList.toggle('active', isDemo);

      if (isDemo) {
        demoIcon.textContent = '⏸';
        demoText.textContent = '暫停巡航演示';
        demoTimer = setInterval(() => {
          t += 0.04;
          
          const roll = +(Math.sin(t * 0.5) * 22).toFixed(1);
          const pitch = +(Math.sin(t * 0.7) * 4.5).toFixed(1);
          const turnRate = +(roll / 7.3).toFixed(2);
          const vsi = Math.round(pitch * 280);
          
          let heading = (parseFloat(ctrl.hdg.value) + turnRate * 0.15) % 360;
          if (heading < 0) heading += 360;
          
          let alt = Math.max(0, Math.min(25000, parseFloat(ctrl.alt.value) + (vsi / 60) * 0.05));
          const airspeed = Math.round(115 - pitch * 2.5 + Math.sin(t * 1.5) * 2);
          const slip = +(Math.sin(t * 1.2) * 0.15).toFixed(2);

          ctrl.roll.value = roll;
          ctrl.pitch.value = pitch;
          ctrl.turn.value = turnRate;
          ctrl.vsi.value = vsi;
          ctrl.hdg.value = Math.round(heading);
          ctrl.alt.value = Math.round(alt);
          ctrl.asi.value = airspeed;
          ctrl.slip.value = slip;

          syncFromSliders();
        }, 50);
      } else {
        demoIcon.textContent = '▶';
        demoText.textContent = '啟動自動巡航展示 (Demo)';
        clearInterval(demoTimer);
      }
    });

    // 頁面加載完成後自動載入初始狀態 (航向 195 度平飛)
    document.getElementById('btn-reset').click();
  </script>
</body>
</html>
